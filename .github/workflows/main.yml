name: Build V8+Fuzzilli (standalone) and push to GHCR

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/v8-fuzzilli-standalone
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo apt-get clean || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          rm -rf $HOME/.cache/* 2>/dev/null || true
          df -h

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip build-essential ninja-build \
            clang lld pkg-config ca-certificates zlib1g-dev libssl-dev \
            libsqlite3-0 libxml2 tzdata libicu-dev libcurl4-openssl-dev

      - name: Install Swiftly (and Swift 6.2.3 for Ubuntu 24.04)
        run: |
          curl -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --quiet-shell-followup || true
          # load swiftly env for the rest of the job
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          hash -r
          # install and use the requested toolchain (6.2.3 for ubuntu24.04)
          swiftly install 6.2.3-ubuntu24.04 || swiftly install 6.2.3 || true
          swiftly use 6.2.3-ubuntu24.04 || swiftly use 6.2.3 || true
          swift --version

      - name: Install depot_tools and add to PATH
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "DEPOT_TOOLS=$(pwd)/depot_tools" >> $GITHUB_ENV
          echo "PATH=$(pwd)/depot_tools:$PATH" >> $GITHUB_ENV
        shell: bash

      - name: Fetch & build V8 with Fuzzilli flags (d8)
        env:
          PATH: ${{ env.PATH }}:${{ github.workspace }}/depot_tools
        run: |
          export PATH="$(pwd)/depot_tools:$PATH"
          fetch v8
          cd v8
          ./build/install-build-deps.sh --no-prompt || true
          git checkout main || true
          gclient sync
          gn gen out/fuzzbuild --args='is_debug=false dcheck_always_on=true v8_static_library=true v8_enable_verify_heap=true v8_enable_partition_alloc=false v8_fuzzilli=true sanitizer_coverage_flags="trace-pc-guard" target_cpu="x64"'
          ninja -C out/fuzzbuild d8
          mkdir -p ../build-out
          cp out/fuzzbuild/d8 ../build-out/
          ls -l ../build-out/d8 || true

      - name: Clean V8 sources to free disk
        run: |
          rm -rf v8
          df -h

      - name: Clone & build Fuzzilli (Swift)
        run: |
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          git clone https://github.com/googleprojectzero/fuzzilli.git
          cd fuzzilli
          swift build -c release
          mkdir -p ../build-out
          cp .build/release/Fuzzilli ../build-out/Fuzzilli
          ls -l ../build-out/Fuzzilli || true

      - name: Copy Swift runtime into build-out (to embed in image)
        run: |
          mkdir -p build-out/swift-runtime/usr/lib/swift/linux
          # copy any installed toolchain runtime(s) found
          cp -r $HOME/.local/share/swiftly/toolchains/*/usr/lib/swift/linux/* build-out/swift-runtime/usr/lib/swift/linux/ || true
          ls -l build-out/swift-runtime/usr/lib/swift/linux || true

      - name: Prepare Docker context and Dockerfile
        run: |
          mkdir -p docker
          mv build-out/* docker/ || true
          # ensure docker/swift-runtime exists (if copy failed above, job will fail later)
          cat > docker/Dockerfile <<'EOF'
          FROM ubuntu:24.04

          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y \
              ca-certificates \
              libstdc++6 libgcc-s1 \
              libicu-dev libcurl4-openssl-dev zlib1g \
              && rm -rf /var/lib/apt/lists/*

          WORKDIR /opt/fuzzing

          # copy d8 and Fuzzilli (Fuzzilli CLI is used as ENTRYPOINT)
          COPY d8 /opt/fuzzing/d8
          COPY Fuzzilli /opt/fuzzing/Fuzzilli

          # copy bundled Swift runtime
          COPY swift-runtime/usr/lib/swift/linux/ /usr/lib/swift/linux/

          RUN chmod +x /opt/fuzzing/d8 /opt/fuzzing/Fuzzilli || true

          ENV LD_LIBRARY_PATH="/usr/lib/swift/linux:$LD_LIBRARY_PATH"
          ENV PATH="/opt/fuzzing:$PATH"

          # verify that the binary exists at image runtime
          ENTRYPOINT ["/opt/fuzzing/Fuzzilli"]
          EOF
          ls -la docker

      - name: Log into ghcr (for push)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build docker -t $IMAGE_NAME:$IMAGE_TAG

      - name: Smoke test: verify d8 has REPRL support inside the image
        run: |
          set -e
          docker run --rm $IMAGE_NAME:$IMAGE_TAG bash -c "/opt/fuzzing/d8 --help | grep -i reprl || ( echo 'REPRL not found in d8' && exit 1 )"

      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
